<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #5e35b1; margin: 0; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header p { color: #666; font-size: 1rem; margin: 5px 0 0 0; }
        .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; border-top: 4px solid #ccc; }
        .stat-card.total { border-top-color: #5e35b1; }
        .stat-card.lost { border-top-color: #ef5350; }
        .stat-card.found { border-top-color: #26a69a; }
        .stat-card h3 { margin: 0 0 10px 0; color: #666; font-size: 1.1rem; }
        .stat-card .number { font-size: 2rem; font-weight: bold; color: #222; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .panel { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .panel h2 { margin-top: 0; margin-bottom: 20px; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; color: #444; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; background-color: #fafafa; }
        input[type="file"] { padding: 5px 0; }
        textarea { resize: vertical; }
        .btn-submit { background-color: #ef5350; color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
        .btn-submit:hover { background-color: #d32f2f; }
        .feed-header { display: flex; gap: 10px; margin-bottom: 20px; }
        .feed-header input { flex: 1; }
        .btn-search { background-color: #5e35b1; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .filter-buttons { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-filter { flex: 1; padding: 8px; background: #fff; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 600; color: #666; transition: all 0.2s; }
        .btn-filter:hover { background: #f0f0f0; }
        .empty-state { text-align: center; color: #888; margin-top: 40px; font-size: 1.05rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔍 Lost & Found Hub</h1>
        <p>Built completely using Python Flask</p>
    </div>

    <div class="stats-container">
        <div class="stat-card total">
            <h3>Total Items</h3>
            <div class="number">0</div>
        </div>
        <div class="stat-card lost">
            <h3>Lost Items</h3>
            <div class="number">0</div>
        </div>
        <div class="stat-card found">
            <h3>Found Items</h3>
            <div class="number">0</div>
        </div>
    </div>

    <div class="main-layout">
        <div class="panel">
            <h2>🔴 Report Lost Item</h2>
            <form action="/report-lost" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" name="itemName" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="Electronics">Electronics</option>
                        <option value="Documents">Documents/IDs</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Keys">Keys</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="image">Add Photo</label>
                    <input type="file" id="image" name="image" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="location">Location Lost</label>
                    <input type="text" id="location" name="location">
                </div>
                <div class="form-group">
                    <label for="date">Date Lost</label>
                    <input type="date" id="date" name="date">
                </div>
                <div class="form-group">
                    <label for="contact">Contact Info</label>
                    <input type="text" id="contact" name="contact">
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Submit Lost Item</button>
            </form>
        </div>

        <div class="panel">
            <h2>📋 Reported Items Feed</h2>
            <div class="feed-header">
                <input type="text" placeholder="Search entries...">
                <button class="btn-search">Search</button>
            </div>
            <div class="filter-buttons">
                <button class="btn-filter">All Items</button>
                <button class="btn-filter">Lost Only</button>
                <button class="btn-filter">Found Only</button>
            </div>
            <div class="empty-state">
                No items match your criteria.
            </div>
        </div>
    </div>

</body>
</html>
